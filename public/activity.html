<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Koh Tao activity details from The House Guide"><title>Activity | The House Guide</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/activity-experience.css"><link rel="stylesheet" href="/ai-concierge.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a><nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header><section class="section"><a class="back-link" href="/activities.html">← Back to Activities</a><div id="detail"></div></section><footer class="footer">The House Guide · Activities &amp; Experiences.</footer></div><a class="float-wa" data-link="houseWhatsapp" target="_blank" rel="noopener" data-action="contact">Contact Us</a><script src="/contacts.js"></script><script src="/guide-app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const db=await (await fetch('/data/activities.json',{cache:'no-store'})).json();const x=db.activities.find(v=>v.id===id);const r=document.getElementById('detail');if(!x){r.innerHTML='<h1>Activity not found</h1>';return}document.title=x.name+' | The House Guide';const facts=[['Duration',x.duration],['Difficulty',x.difficulty],['Minimum age',x.minimumAge],['Beginners',x.suitableBeginners],['Children',x.suitableChildren],['Swimming ability',x.swimmingAbility],['Fitness level',x.fitnessLevel],['Group format',x.privateOrGroup],['Maximum group size',x.maximumGroupSize],['Approximate price',x.price],['Equipment included',x.equipmentIncluded],['Extra costs',x.extraCosts],['Best season',x.bestSeason],['Best months',x.bestMonths],['Best time of day',x.bestTimeOfDay],['Weather',x.weatherConsiderations],['Opening hours',x.hours],['Languages',x.languages],['Payment',x.payment],['Hotel pickup',x.hotelPickup],['Accessibility',x.accessibility],['Parking',x.parking],['Toilets',x.toilets],['Showers',x.showers],['Lockers',x.lockers],['Food nearby/available',x.food],['Drinking water',x.drinkingWater],['Shade',x.shade],['Wi-Fi',x.wifi],['Mobile signal',x.mobileSignal]].filter(v=>v[1]);const acts=[];if(x.phone)acts.push(`<a class="btn secondary" href="tel:${x.phone}" data-action="call">Call</a>`);if(x.email&&x.email.includes('@'))acts.push(`<a class="btn secondary" href="mailto:${x.email}">Email</a>`);acts.push(`<a class="btn" href="${x.map}" target="_blank" rel="noopener">Open Map</a>`);if(x.website)acts.push(`<a class="btn secondary" href="${x.website}" target="_blank" rel="noopener">Visit Website</a>`);if(x.facebook)acts.push(`<a class="btn secondary" href="${x.facebook}" target="_blank" rel="noopener">Facebook</a>`);if(x.instagram)acts.push(`<a class="btn secondary" href="${x.instagram}" target="_blank" rel="noopener">Instagram</a>`);const src=x.verificationSources.length?`<section class="activity-section"><h2>Verification Sources</h2><ul class="activity-sources">${x.verificationSources.map(u=>`<li><a href="${u}" target="_blank" rel="noopener">${u}</a></li>`).join('')}</ul></section>`:'';r.innerHTML=`<div class="activity-detail-hero"><div class="activity-detail-title">${x.preferred?'<span class="activity-preferred">The House Preferred</span>':''}<div>${x.category} · ${x.area}</div><h1>${x.name}</h1><p>${x.description}</p></div></div><section class="activity-section activity-recommendation"><h2>Why Choose It</h2><p>${x.whyChoose}</p><p><strong>Best known for:</strong> ${x.bestKnownFor}</p><p><strong>What makes it different:</strong> ${x.whatMakesDifferent}</p></section><section class="activity-section"><h2>Perfect For</h2><div class="perfect-for">${x.perfectFor.map(v=>`<span class="perfect-pill">${v}</span>`).join('')}</div></section><section class="activity-section"><h2>Visitor & Practical Information</h2><div class="activity-facts">${facts.map(v=>`<div class="activity-fact"><strong>${v[0]}</strong>${v[1]}</div>`).join('')}</div></section><section class="activity-section"><h2>What to Bring</h2><p>${x.whatToBring}</p></section><section class="activity-section"><h2>Booking</h2><div class="activity-facts"><div class="activity-fact"><strong>Booking required</strong>${x.bookingRequired||'Not specified'}</div><div class="activity-fact"><strong>Advance booking</strong>${x.advanceBooking||'Not specified'}</div><div class="activity-fact"><strong>Walk-ins</strong>${x.walkIns||'Not specified'}</div><div class="activity-fact"><strong>Cancellation policy</strong>${x.cancellationPolicy||'Not specified'}</div></div></section><section class="activity-section activity-safety"><h2>Safety</h2><p>${x.safety}</p></section><section class="activity-section activity-tip"><h2>Concierge Notes</h2><p>${x.conciergeNotes}</p></section><section class="activity-section"><h2>Nearby</h2><p>${x.nearby}</p></section><div class="activity-actions">${acts.join('')}</div>${src}`})();
</script><script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script><script src="/ai-concierge-config.js"></script><script src="/ai-concierge.js"></script></body></html>
