<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Restaurant details from The House Guide">
<title>Restaurant Details | The House Guide</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/ai-concierge.css">
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a>
  <nav class="nav">
    <a href="/rooms.html">Your Room</a>
    <a href="/house.html">The House</a>
    <a href="/practical.html">Guest Information</a>
    <a href="/explore.html">Explore</a>
    <a href="/emergency.html">Help & Emergency</a>
    <a href="/checkout.html">Departure</a>
  </nav>
</header>

<section class="section">
  <a class="back-link" href="/restaurants.html">← Back to restaurants</a>
  <div id="restaurantDetail"></div>
</section>

<footer class="footer">The House Guide · Restaurant details.</footer>
</div>
<a class="float-wa" data-link="houseWhatsapp" target="_blank" rel="noopener" data-action="contact">Contact Us</a>
<script src="/contacts.js"></script>
<script src="/guide-app.js"></script>
<script src="/restaurants-data.js"></script>
<script>
(function(){
  const id = new URLSearchParams(window.location.search).get("id");
  const r = (window.HOUSE_RESTAURANTS || []).find(item => item.slug === id);
  const root = document.getElementById("restaurantDetail");

  if(!r){
    root.innerHTML = `<h1>Restaurant not found</h1><div class="btns"><a class="btn" href="/restaurants.html">Back to Restaurants</a></div>`;
    return;
  }

  document.title = `${r.name} | The House Guide`;
  const images = r.images.map((src, i) =>
    `<img src="${src}" alt="${r.name} ${i === 0 ? 'arrival' : i === 1 ? 'food' : 'atmosphere'}">`
  ).join("");
  const tags = r.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
  const website = r.website
    ? `<a class="btn secondary" href="${r.website}" target="_blank" rel="noopener">Visit Website</a>`
    : "";

  root.innerHTML = `
    <div class="partner-header">
      <div>
        <h1>${r.name}</h1>
        <p class="section-intro">${r.experience}</p>
      </div>
    </div>

    <div class="tip-box"><strong>Why it is worth your time</strong><br>${r.tip}</div>
    <p>${r.description}</p>

    <h2>A closer look</h2>
    <p class="swipe-hint">← Swipe across the photos →</p>
    <div class="detail-gallery">${images}</div>

    <div class="detail-meta">
      <div class="meta-item"><strong>Cuisine</strong><br>${r.cuisine}</div>
      <div class="meta-item"><strong>Price</strong><br>${r.price}</div>
    </div>
    <div class="tags">${tags}</div>
    <div class="btns">
      <a class="btn" href="${r.map}" target="_blank" rel="noopener">Open Map</a>
      ${website}
    </div>
    <p class="ai-note">Restaurant illustrations are AI-created editorial visuals and are not exact documentary photographs of the venue or dishes.</p>
  `;
})();
</script>
<script src="/module-registry.js"></script>
<script src="/platform-actions.js"></script>
<script src="/platform-action-runtime.js"></script>
<script src="/ai-concierge-config.js"></script>
<script src="/ai-concierge.js"></script>
<script src="/places-loader.js"></script>
</body>
</html>
