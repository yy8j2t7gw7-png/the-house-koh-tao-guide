<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafés We Recommend | The House Guide</title><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/cafe-experience.css"><link rel="stylesheet" href="/ai-concierge.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a><nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header><section class="section"><a class="back-link" href="/explore.html">← Back to Explore</a><h1>Cafés We Recommend</h1><p class="section-intro">From serious coffee and artisan bakeries to beachfront breakfasts, healthy bowls and dedicated workspaces.</p><div class="cafe-filters" id="filters"></div></section><section class="section"><div class="cafe-grid" id="grid"></div></section></div><a class="float-wa" data-link="houseWhatsapp" data-action="contact">Contact Us</a><script src="/contacts.js"></script><script src="/guide-app.js"></script><script>
(async()=>{let d=await (await fetch('/data/cafes.json')).json(),a=d.cafes,f=['All','Breakfast','Brunch','Specialty Coffee','Bakery','Healthy','Vegan','Beachfront','Remote Work','Air Conditioned'],F=document.getElementById('filters'),G=document.getElementById('grid');function R(q='All'){let s=q==='All'?a:a.filter(x=>[...x.categories,...x.perfectFor].some(v=>v.toLowerCase().includes(q.toLowerCase())));G.innerHTML=s.map(x=>`<article class="cafe-card"><div class="cafe-card-media">☕</div><div class="cafe-card-body"><div>${x.area}</div><h2>${x.name}</h2><p>${x.cardDescription}</p><div class="tags">${x.perfectFor.slice(0,3).map(v=>`<span class="tag">${v}</span>`).join('')}</div><div class="btns"><a class="btn" href="/cafe.html?id=${encodeURIComponent(x.id)}">View Café →</a></div></div></article>`).join('')}F.innerHTML=f.map((x,i)=>`<button class="cafe-filter ${i?'':'is-active'}" data-filter="${x}">${x}</button>`).join('');F.onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;F.querySelectorAll('button').forEach(x=>x.classList.remove('is-active'));b.classList.add('is-active');R(b.dataset.filter)};R()})();
</script><script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script><script src="/ai-concierge.js"></script></body></html>
