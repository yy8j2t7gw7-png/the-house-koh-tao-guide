<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café | The House Guide</title><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/cafe-experience.css"><link rel="stylesheet" href="/ai-concierge.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a><nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header><section class="section"><a class="back-link" href="/cafes.html">← Back to cafés</a><div id="detail"></div></section></div><a class="float-wa" data-link="houseWhatsapp" data-action="contact">Contact Us</a><script src="/contacts.js"></script><script src="/guide-app.js"></script><script>
(async()=>{let id=new URLSearchParams(location.search).get('id'),d=await (await fetch('/data/cafes.json')).json(),x=d.cafes.find(v=>v.id===id),r=document.getElementById('detail');if(!x){r.innerHTML='<h1>Café not found</h1>';return}document.title=x.name+' | The House Guide';let p=x.perfectFor.map(v=>`<span class="perfect-pill">${v}</span>`).join(''),n=x.nearby.map(v=>`<span class="nearby-item">${v}</span>`).join(''),m=x.menu.type==='none'?'<div class="cafe-placeholder">No stable online menu is currently available.</div>':`<a class="btn" target="_blank" href="${x.menu.url}">Menu</a>`,a=[];if(x.phone)a.push(`<a class="btn secondary" href="tel:${x.phone}" data-action="call">Call</a>`);a.push(`<a class="btn" target="_blank" href="${x.map}">Open Map</a>`);if(x.website)a.push(`<a class="btn secondary" target="_blank" href="${x.website}">Visit Website</a>`);if(x.facebook)a.push(`<a class="btn secondary" target="_blank" href="${x.facebook}">Facebook</a>`);if(x.instagram)a.push(`<a class="btn secondary" target="_blank" href="${x.instagram}">Instagram</a>`);r.innerHTML=`<div class="cafe-detail-hero"><div class="cafe-detail-title"><div>${x.area}</div><h1>${x.name}</h1><p>${x.cardDescription}</p></div></div><section class="cafe-section"><h2>About</h2><p>${x.about}</p></section><section class="cafe-section cafe-recommendation"><h2>Our Recommendation</h2><p>${x.recommendation}</p></section><section class="cafe-section cafe-tip"><h2>Local Tip</h2><p>${x.localTip}</p></section><section class="cafe-section"><h2>Our Pick</h2><p><strong>${x.ourPick}</strong></p></section><section class="cafe-section"><h2>Perfect For</h2><div class="perfect-for">${p}</div></section><section class="cafe-section"><h2>Practical Information</h2><div class="cafe-facts"><div class="cafe-fact"><strong>Opening hours</strong><br>${x.hours}</div><div class="cafe-fact"><strong>Remote work</strong><br>${x.remoteWork}</div><div class="cafe-fact"><strong>Family friendly</strong><br>${x.familyFriendly}</div><div class="cafe-fact"><strong>Air conditioning</strong><br>${x.airConditioning}</div><div class="cafe-fact"><strong>Seating</strong><br>${x.seating}</div></div></section><section class="cafe-section"><h2>Gallery</h2><div class="cafe-placeholder">Photos will be added here later.</div><h2>Menu</h2>${m}</section><section class="cafe-section"><h2>Nearby</h2><div class="nearby-list">${n}</div></section><div class="cafe-actions">${a.join('')}</div>`})();
</script><script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script><script src="/ai-concierge.js"></script></body></html>
