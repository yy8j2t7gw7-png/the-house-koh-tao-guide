<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bar | The House Guide</title><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/bar-experience.css"><link rel="stylesheet" href="/ai-concierge.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a><nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header><section class="section"><a class="back-link" href="/bars.html">← Back to bars</a><div id="detail"></div></section></div><a class="float-wa" data-link="houseWhatsapp" data-action="contact">Contact Us</a><script src="/contacts.js"></script><script src="/guide-app.js"></script><script>
(async()=>{let id=new URLSearchParams(location.search).get('id'),d=await (await fetch('/data/bars.json')).json(),x=d.bars.find(v=>v.id===id),r=document.getElementById('detail');if(!x){r.innerHTML='<h1>Venue not found</h1>';return}document.title=x.name+' | The House Guide';let p=x.perfectFor.map(v=>`<span class="perfect-pill">${v}</span>`).join(''),n=x.nearby.map(v=>`<span class="nearby-item">${v}</span>`).join(''),a=[];if(x.phone)a.push(`<a class="btn secondary" href="tel:${x.phone}" data-action="call">Call</a>`);a.push(`<a class="btn" target="_blank" href="${x.map}">Open Map</a>`);if(x.website)a.push(`<a class="btn secondary" target="_blank" href="${x.website}">Visit Website</a>`);if(x.facebook)a.push(`<a class="btn secondary" target="_blank" href="${x.facebook}">Facebook</a>`);if(x.instagram)a.push(`<a class="btn secondary" target="_blank" href="${x.instagram}">Instagram</a>`);r.innerHTML=`<div class="bar-detail-hero"><div class="bar-detail-title"><div>${x.area}</div><h1>${x.name}</h1><p>${x.cardDescription}</p></div></div><section class="bar-section"><h2>About</h2><p>${x.about}</p></section><section class="bar-section bar-recommendation"><h2>Our Recommendation</h2><p>${x.recommendation}</p></section><section class="bar-section bar-tip"><h2>Local Tip</h2><p>${x.localTip}</p></section><section class="bar-section"><h2>Our Pick</h2><p><strong>${x.ourPick}</strong></p></section><section class="bar-section"><h2>Perfect For</h2><div class="perfect-for">${p}</div></section><section class="bar-section"><h2>Practical Information</h2><div class="bar-facts"><div class="bar-fact"><strong>Opening hours</strong><br>${x.hours||'Not specified'}</div><div class="bar-fact"><strong>Happy hour</strong><br>${x.happyHour||'Not specified'}</div><div class="bar-fact"><strong>Price level</strong><br>${x.priceLevel||'Not specified'}</div><div class="bar-fact"><strong>Payment</strong><br>${x.payment||'Not specified'}</div><div class="bar-fact"><strong>Atmosphere</strong><br>${x.atmosphere||'Not specified'}</div><div class="bar-fact"><strong>Music</strong><br>${x.musicStyle||'Not specified'}</div><div class="bar-fact"><strong>Signature drink</strong><br>${x.signatureDrink||'Not specified'}</div><div class="bar-fact"><strong>Signature food</strong><br>${x.signatureFood||'Not specified'}</div><div class="bar-fact"><strong>Air conditioning</strong><br>${x.airConditioning||'Not specified'}</div><div class="bar-fact"><strong>Seating</strong><br>${x.seating||'Not specified'}</div><div class="bar-fact"><strong>Accessibility</strong><br>${x.accessibility||'Not specified'}</div><div class="bar-fact"><strong>Parking</strong><br>${x.parking||'Not specified'}</div><div class="bar-fact"><strong>Dress code</strong><br>${x.dressCode||'Not specified'}</div><div class="bar-fact"><strong>Remote work</strong><br>${x.remoteWork||'Not specified'}</div><div class="bar-fact"><strong>Typical crowd</strong><br>${x.typicalCrowd||'Not specified'}</div><div class="bar-fact"><strong>Reservations</strong><br>${x.reservations||'Not specified'}</div><div class="bar-fact"><strong>Special events</strong><br>${x.specialEvents||'Not specified'}</div></div></section><section class="bar-section"><h2>Gallery</h2><div class="bar-placeholder">Photos and logos will be added later.</div></section><section class="bar-section"><h2>Nearby</h2><div class="nearby-list">${n||'<span class="nearby-item">Koh Tao</span>'}</div></section><div class="bar-actions">${a.join('')}</div>`})();
</script><script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script><script src="/ai-concierge.js"></script></body></html>
