<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping & Essentials | The House Guide</title><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/shopping-experience.css"><link rel="stylesheet" href="/ai-concierge.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a><nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header><section class="section"><a class="back-link" href="/shopping.html">← Back to Shopping & Essentials</a><div id="detail"></div></section></div><a class="float-wa" data-link="houseWhatsapp" data-action="contact">Contact Us</a><script src="/contacts.js"></script><script src="/concierge-booking.js"></script><script src="/guide-app.js"></script><script>
(async()=>{let id=new URLSearchParams(location.search).get('id'),d=await (await fetch('/data/shopping.json')).json(),x=d.items.find(v=>v.id===id),r=document.getElementById('detail');if(!x){r.innerHTML='<h1>Location not found</h1>';return}document.title=x.name+' | The House Guide';let p=x.perfectFor.map(v=>`<span class="perfect-pill">${v}</span>`).join(''),n=x.nearby.map(v=>`<span class="nearby-item">${v}</span>`).join(''),a=[],houseBooking=x.bookingPolicy==='the-house-concierge',bookingNote='';if(houseBooking){const booking=window.HOUSE_CONCIERGE_BOOKING.createBooking(x.name);a.push(`<a class="btn" target="_blank" rel="noopener" href="${booking.whatsappHref}" data-action="booking">${booking.primaryLabel}</a>`);a.push(`<a class="btn secondary" href="${booking.phoneHref}" data-action="bookingCall">${booking.callLabel}</a>`);bookingNote='<section class="shopping-section shopping-recommendation"><h2>Bookings</h2><p>Book this service through The House so our concierge can check availability and help coordinate the reservation.</p></section>'}else if(x.phone)a.push(`<a class="btn secondary" href="tel:${x.phone}" data-action="call">Call</a>`);a.push(`<a class="btn" target="_blank" rel="noopener" href="${x.map}">Open Map</a>`);if(!houseBooking&&x.website)a.push(`<a class="btn secondary" target="_blank" rel="noopener" href="${x.website}">Visit Website</a>`);if(!houseBooking&&x.facebook)a.push(`<a class="btn secondary" target="_blank" rel="noopener" href="${x.facebook}">Facebook</a>`);if(!houseBooking&&x.instagram)a.push(`<a class="btn secondary" target="_blank" rel="noopener" href="${x.instagram}">Instagram</a>`);r.innerHTML=`<div class="shopping-detail-hero"><div class="shopping-detail-title"><div>${x.category}</div><h1>${x.name}</h1><p>${x.cardDescription}</p></div></div><section class="shopping-section"><h2>About</h2><p>${x.about}</p></section><section class="shopping-section shopping-recommendation"><h2>Our Recommendation</h2><p>${x.recommendation}</p></section><section class="shopping-section shopping-tip"><h2>Local Tip</h2><p>${x.localTip}</p></section><section class="shopping-section"><h2>Our Pick</h2><p><strong>${x.ourPick}</strong></p></section>${bookingNote}<section class="shopping-section"><h2>Perfect For</h2><div class="perfect-for">${p}</div></section><section class="shopping-section"><h2>Practical Information</h2><div class="shopping-facts"><div class="shopping-fact"><strong>Opening hours</strong><br>${x.hours||'Not specified'}</div><div class="shopping-fact"><strong>Price level</strong><br>${x.priceLevel||'Not specified'}</div><div class="shopping-fact"><strong>Payment</strong><br>${x.payment||'Not specified'}</div><div class="shopping-fact"><strong>English</strong><br>${x.english||'Not specified'}</div><div class="shopping-fact"><strong>Air conditioning</strong><br>${x.airConditioning||'Not specified'}</div><div class="shopping-fact"><strong>Parking</strong><br>${x.parking||'Not specified'}</div><div class="shopping-fact"><strong>Wheelchair access</strong><br>${x.wheelchair||'Not specified'}</div><div class="shopping-fact"><strong>Delivery / ordering</strong><br>${x.delivery||'Not specified'}</div></div></section><section class="shopping-section"><h2>Gallery</h2><div class="shopping-placeholder">Photos and logos will be added later.</div></section><section class="shopping-section"><h2>Nearby</h2><div class="nearby-list">${n||'<span class="nearby-item">Koh Tao</span>'}</div></section><div class="shopping-actions">${a.join('')}</div>`})();
</script><script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script><script src="/ai-concierge-config.js"></script><script src="/ai-concierge.js"></script></body></html>
