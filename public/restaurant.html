<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="description" content="Restaurant details from The House Guide">
<title>Restaurant | The House Guide</title><link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/restaurant-experience.css"><link rel="stylesheet" href="/ai-concierge.css">
</head><body><div class="shell">
<header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="The House Koh Tao"></a>
<nav class="nav"><a href="/rooms.html">Your Room</a><a href="/house.html">The House</a><a href="/practical.html">Guest Information</a><a href="/explore.html">Explore</a><a href="/emergency.html">Help & Emergency</a><a href="/checkout.html">Departure</a></nav></header>
<section class="section"><a class="back-link" href="/restaurants.html">← Back to restaurants</a><div id="restaurantDetail"></div></section>
<footer class="footer">The House Guide · Restaurant details.</footer></div>
<a class="float-wa" data-link="houseWhatsapp" target="_blank" rel="noopener" data-action="contact">Contact Us</a>
<script src="/contacts.js"></script><script src="/guide-app.js"></script>
<script>
(async function(){
 const id=new URLSearchParams(location.search).get('id'), root=document.getElementById('restaurantDetail');
 const response=await fetch('/data/places.json',{cache:'no-store'}), db=await response.json();
 const p=db.places.find(x=>x.id===id&&x.type==='restaurant');
 if(!p){root.innerHTML='<h1>Restaurant not found</h1><div class="btns"><a class="btn" href="/restaurants.html">Back to Restaurants</a></div>';return}
 document.title=`${p.name} | The House Guide`;
 const hero=p.media.heroImage?`<img src="${p.media.heroImage}" alt="${p.name}">`:'';
 const gallery=p.media.gallery.length?p.media.gallery.map((src,i)=>`<img src="${src}" alt="${p.name} photo ${i+1}">`).join(''):'<div class="menu-notice">Photos are being prepared for this recommendation.</div>';
 const perfect=p.content.perfectFor.map(x=>`<span class="perfect-pill">${x}</span>`).join('');
 const menu=renderMenu(p.menu);
 function renderMenu(menu){
   if(!menu||menu.type==='none') return `<div class="menu-notice">${menu?.note||'Menu details will be added when an official menu is available.'}</div>`;
   if(menu.type==='images'&&Array.isArray(menu.items)&&menu.items.length) return `<div class="restaurant-gallery">${menu.items.map((src,i)=>`<img src="${src}" alt="${p.name} menu page ${i+1}">`).join('')}</div>`;
   if((menu.type==='pdf'||menu.type==='website')&&menu.url) return `<a class="btn" href="${menu.url}" target="_blank" rel="noopener">Open Menu</a>`;
   if(menu.type==='multiple'&&Array.isArray(menu.items)&&menu.items.length) return `<div class="menu-links">${menu.items.map(item=>`<a class="btn secondary" href="${item.url}" target="_blank" rel="noopener">${item.label||'Menu'}</a>`).join('')}</div>`;
   return '<div class="menu-notice">Menu details will be added when available.</div>';
 }
 const actions=[];
 if(p.actions.showReservation&&p.contact.reservation)actions.push(`<a class="btn" href="${p.contact.reservation}" target="_blank" rel="noopener">Request a Reservation</a>`);
 if(p.actions.showCall&&p.contact.phone)actions.push(`<a class="btn secondary" href="tel:${p.contact.phone}" data-action="call">Call</a>`);
 if(p.actions.showMap&&p.contact.map)actions.push(`<a class="btn secondary" href="${p.contact.map}" target="_blank" rel="noopener">Open Map</a>`);
 if(p.actions.showWebsite&&p.contact.website)actions.push(`<a class="btn secondary" href="${p.contact.website}" target="_blank" rel="noopener">Visit Website</a>`);
 root.innerHTML=`
 <div class="restaurant-detail-hero">${hero}<div class="restaurant-detail-overlay"></div><div class="restaurant-detail-title"><div>${p.area}</div><h1>${p.name}</h1><p>${p.cardDescription}</p></div></div>
 <section class="place-section"><h2>About</h2><p>${p.content.about}</p></section>
 <section class="place-section recommendation-box"><h2>Our Recommendation</h2><p>${p.content.recommendation}</p></section>
 <section class="place-section local-tip-box"><h2>Local Tip</h2><p>${p.content.localTip}</p></section>
 <section class="place-section our-pick-box"><h2>Our Pick</h2><p>${p.ourPick||'Ask the team what they recommend today.'}</p></section>
 <section class="place-section"><h2>Perfect For</h2><div class="perfect-for">${perfect}</div></section>
 <section class="place-section"><div class="media-tabs"><button class="media-tab is-active" data-tab="gallery">Gallery</button><button class="media-tab" data-tab="menu">Menu</button></div>
 <div class="media-panel" data-panel="gallery"><div class="restaurant-gallery">${gallery}</div></div>
 <div class="media-panel" data-panel="menu" hidden>${menu}</div></section>
 <div class="detail-actions">${actions.join('')}</div>`;
 root.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;root.querySelectorAll('.media-tab').forEach(x=>x.classList.toggle('is-active',x===b));root.querySelectorAll('.media-panel').forEach(x=>x.hidden=x.dataset.panel!==b.dataset.tab)});
})();
</script>
<script src="/module-registry.js"></script><script src="/platform-actions.js"></script><script src="/platform-action-runtime.js"></script>
<script src="/ai-concierge-config.js"></script><script src="/ai-concierge.js"></script></body></html>
